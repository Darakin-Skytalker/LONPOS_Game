<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONPOS2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <h1>LONPOS</h1>

        <h4>➤ Press 'q' while grabing a piece to rotate</h4>
        <h4>➤ Press 'w' while grabing a piece to reflect vertically</h4>
        <h4>➤ Press 'e' while grabing a piece to reflect horizontally</h4>
        <h4>➤ GOAL: Fill the 5×11 board with the 12 pieces below the board</h4>

    
        <main class="game">
        

        <div class="board"></div>

        <button class="reset-button">Reset</button>

        <div class="pieces"></div>

        <div class="win-message">
        YOU WON
        </div>  
    </main>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
